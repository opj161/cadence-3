<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadence</title>
    <script>
      (() => {
        const storageKey = 'cadence-theme';
        const defaultTheme = 'dark';

        try {
          const storedTheme = localStorage.getItem(storageKey);
          const resolvedTheme = storedTheme === 'light' || storedTheme === 'dark'
            ? storedTheme
            : defaultTheme;

          document.documentElement.classList.toggle('dark', resolvedTheme === 'dark');
          document.documentElement.style.colorScheme = resolvedTheme;
        } catch {
          document.documentElement.classList.add(defaultTheme);
          document.documentElement.style.colorScheme = defaultTheme;
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="overflow-hidden bg-gray-50 text-gray-900 transition-colors duration-200 dark:bg-gray-950 dark:text-gray-100">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
